[project]
name = "near-value-intelligence"
version = "0.1.0"
description = "Evidence-first research platform: Does NEAR's Intents activity turn into value for tokenholders?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "duckdb>=1.0",
    "pyarrow>=16",
    "requests>=2.31",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    "zstandard>=0.22",
    "polars>=1.0",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-core>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]

[tool.uv]
python-version = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
