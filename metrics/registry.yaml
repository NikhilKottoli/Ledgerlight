version: "1"
metrics:
  - id: defillama.tvl.near_intents.daily
    name: DefiLlama TVL — NEAR Intents (Daily)
    kind: measured
    unit: USD
    entity: usd
    source:
      name: DefiLlama
      url: "https://api.llama.fi/protocol/near-intents"
      endpoint_or_table: "protocol/near-intents"
    definition: "Total Value Locked in NEAR Intents protocol as reported by DefiLlama (totalLiquidityUSD)"
    calc_ref: "pipeline/connectors/defillama.py → pipeline/normalize/defillama.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: unknown
    limitations: ["DefiLlama methodology may differ from onchain measurements", "TVL is not a flow of money into fees"]
    depends_on: []

  - id: defillama.fees.near_intents.daily
    name: DefiLlama Fees — NEAR Intents (Daily)
    kind: measured
    unit: USD
    entity: usd
    source:
      name: DefiLlama
      url: "https://api.llama.fi/summary/fees/near-intents?dataType=dailyFees"
      endpoint_or_table: "summary/fees/near-intents"
    definition: "Gross fees charged on NEAR Intents swaps - protocol fee plus affiliate fee each frontend collects, summed across all integrators"
    calc_ref: "pipeline/connectors/defillama_fees.py → pipeline/normalize/defillama_fees.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: unknown
    limitations: ["DefiLlama methodology; may not match onchain exactly"]
    depends_on: []

  - id: defillama.revenue.near_intents.daily
    name: DefiLlama Revenue — NEAR Intents (Daily)
    kind: measured
    unit: USD
    entity: usd
    source:
      name: DefiLlama
      url: "https://api.llama.fi/summary/fees/near-intents?dataType=dailyRevenue"
      endpoint_or_table: "summary/fees/near-intents"
    definition: "NEAR's net captured revenue, measured as NEAR/wNEAR swept into its revenue wallets (reconciles with revenue.near.org and onchain buyback). Split by destination wallet."
    calc_ref: "pipeline/connectors/defillama_fees.py → pipeline/normalize/defillama_fees.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: unknown
    limitations: ["DefiLlama methodology; may not match onchain exactly"]
    depends_on: []

  - id: defillama.holders_revenue.near_intents.daily
    name: DefiLlama Holders Revenue — NEAR Intents (Daily)
    kind: measured
    unit: USD
    entity: usd
    source:
      name: DefiLlama
      url: "https://api.llama.fi/summary/fees/near-intents?dataType=dailyHoldersRevenue"
      endpoint_or_table: "summary/fees/near-intents"
    definition: "Since 2026-02-23, NEAR's captured Intents revenue used to buy back NEAR on the open market (not burned), returning value to holders"
    calc_ref: "pipeline/connectors/defillama_fees.py → pipeline/normalize/defillama_fees.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: unknown
    limitations: ["DefiLlama methodology; may not match onchain exactly"]
    depends_on: []

  - id: revenue.net.near_intents.daily
    name: Net Revenue (NEAR) — NEAR Intents (Onchain Rebuild)
    kind: derived
    unit: NEAR
    entity: near
    source:
      name: BigQuery (crypto_near_mainnet_us)
      url: "https://console.cloud.google.com/bigquery?project=bigquery-public-data&p=crypto_near_mainnet_us"
      endpoint_or_table: "receipt_actions, ft_balances_daily"
    definition: "Native NEAR + wNEAR transfers into revenue wallets (fefundsadmin, buybacks, 1csfundsadmin), excluding inter-wallet hops. Quota-limited to 30 days."
    calc_ref: "pipeline/metrics/revenue_wallets.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: partial
    limitations: ["Quota-limited to 30 days; wNEAR from ft_balances_daily balance deltas; outflows not yet included"]
    depends_on: ["defillama.fees.near_intents.daily"]

  - id: reconciliation.revenue.three_way
    name: Three-Way Revenue Reconciliation
    kind: derived
    unit: ratio
    entity: ratio
    source:
      name: Internal
      url: "https://github.com/near-value-intelligence"
      endpoint_or_table: "pipeline/reconcile/revenue.py"
    definition: "Comparison of onchain rebuild vs DefiLlama revenue vs revenue.near.org reference values"
    calc_ref: "pipeline/reconcile/revenue.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: partial
    limitations: ["Quota-limited to 30 days; price conversion needed for NEAR↔USD; revenue.near.org figures are illustrative"]
    depends_on: ["revenue.net.near_intents.daily", "defillama.revenue.near_intents.daily", "defillama.fees.near_intents.daily"]

  - id: flow_ledger_30d
    name: Economic Flow Ledger — 30 Days
    kind: derived
    unit: ratio
    entity: ratio
    source:
      name: Internal
      url: "https://github.com/near-value-intelligence"
      endpoint_or_table: "pipeline/flows/ledger.py"
    definition: "Economic flow from gross fees through net revenue to buyback destinations for 30-day window"
    calc_ref: "pipeline/flows/ledger.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: partial
    limitations: ["Placeholder split estimates; needs BigQuery outflows and buyback trace"]
    depends_on: ["revenue.net.near_intents.daily", "defillama.fees.near_intents.daily", "defillama.holders_revenue.near_intents.daily"]

  - id: flow_ledger_7d
    name: Economic Flow Ledger — 7 Days
    kind: derived
    unit: ratio
    entity: ratio
    source:
      name: Internal
      url: "https://github.com/near-value-intelligence"
      endpoint_or_table: "pipeline/flows/ledger.py"
    definition: "Economic flow from gross fees through net revenue to buyback destinations for 7-day window"
    calc_ref: "pipeline/flows/ledger.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: partial
    limitations: ["Placeholder split estimates; needs BigQuery outflows and buyback trace"]
    depends_on: ["revenue.net.near_intents.daily", "defillama.fees.near_intents.daily", "defillama.holders_revenue.near_intents.daily"]

  - id: flow_ledger_90d
    name: Economic Flow Ledger — 90 Days
    kind: derived
    unit: ratio
    entity: ratio
    source:
      name: Internal
      url: "https://github.com/near-value-intelligence"
      endpoint_or_table: "pipeline/flows/ledger.py"
    definition: "Economic flow from gross fees through net revenue to buyback destinations for 90-day window"
    calc_ref: "pipeline/flows/ledger.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: partial
    limitations: ["Placeholder split estimates; needs BigQuery outflows and buyback trace"]
    depends_on: ["revenue.net.near_intents.daily", "defillama.fees.near_intents.daily", "defillama.holders_revenue.near_intents.daily"]

  - id: flow_ledger_ytd
    name: Economic Flow Ledger — Year to Date
    kind: derived
    unit: ratio
    entity: ratio
    source:
      name: Internal
      url: "https://github.com/near-value-intelligence"
      endpoint_or_table: "pipeline/flows/ledger.py"
    definition: "Economic flow from gross fees through net revenue to buyback destinations for YTD window"
    calc_ref: "pipeline/flows/ledger.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: partial
    limitations: ["Placeholder split estimates; needs BigQuery outflows and buyback trace"]
    depends_on: ["revenue.net.near_intents.daily", "defillama.fees.near_intents.daily", "defillama.holders_revenue.near_intents.daily"]

  - id: flow_ledger_all
    name: Economic Flow Ledger — All Time
    kind: derived
    unit: ratio
    entity: ratio
    source:
      name: Internal
      url: "https://github.com/near-value-intelligence"
      endpoint_or_table: "pipeline/flows/ledger.py"
    definition: "Economic flow from gross fees through net revenue to buyback destinations for all-time window"
    calc_ref: "pipeline/flows/ledger.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: partial
    limitations: ["Placeholder split estimates; needs BigQuery outflows and buyback trace"]
    depends_on: ["revenue.net.near_intents.daily", "defillama.fees.near_intents.daily", "defillama.holders_revenue.near_intents.daily"]

  - id: intents.volume_usd.daily
    name: Intents Volume (USD) — Daily
    kind: measured
    unit: USD
    entity: usd
    source:
      name: NEAR Intents Explorer
      url: "https://explorer.near-intents.org"
      endpoint_or_table: "api/v0/transactions"
    definition: "Total USD volume of successful Intents swaps per day (amountInUsd)"
    calc_ref: "pipeline/connectors/intents_explorer.py → pipeline/normalize/intents.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: partial
    limitations: ["Requires Intents JWT; 1 req/5s rate limit; only 1Click integrator coverage"]
    depends_on: []

  - id: intents.swaps.daily
    name: Intents Swaps — Daily
    kind: measured
    unit: count
    entity: count
    source:
      name: NEAR Intents Explorer
      url: "https://explorer.near-intents.org"
      endpoint_or_table: "api/v0/transactions"
    definition: "Number of successful Intents swaps per day"
    calc_ref: "pipeline/connectors/intents_explorer.py → pipeline/normalize/intents.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: partial
    limitations: ["Requires Intents JWT; 1 req/5s rate limit; only 1Click integrator coverage"]
    depends_on: []

  - id: intents.unique_sender_addresses.daily
    name: Unique Sender Addresses — Daily
    kind: measured
    unit: count
    entity: count
    source:
      name: NEAR Intents Explorer
      url: "https://explorer.near-intents.org"
      endpoint_or_table: "api/v0/transactions"
    definition: "Distinct signer addresses with ≥1 successful swap per day"
    calc_ref: "pipeline/connectors/intents_explorer.py → pipeline/normalize/intents.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: partial
    limitations: ["Requires Intents JWT; 1 req/5s rate limit; addresses ≠ humans"]
    depends_on: []

  - id: intents.avg_swap_usd.daily
    name: Avg Swap Size (USD) — Daily
    kind: derived
    unit: USD
    entity: usd
    source:
      name: Internal
      url: "https://github.com/near-value-intelligence"
      endpoint_or_table: "pipeline/normalize/intents.py"
    definition: "Volume USD / Swaps per day"
    calc_ref: "pipeline/normalize/intents.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: partial
    limitations: ["Derived from volume and swaps; same limitations apply"]
    depends_on: ["intents.volume_usd.daily", "intents.swaps.daily"]

  - id: intents.status_mix.daily
    name: Intents Status Mix — Daily
    kind: measured
    unit: ratio
    entity: ratio
    source:
      name: NEAR Intents Explorer
      url: "https://explorer.near-intents.org"
      endpoint_or_table: "api/v0/transactions"
    definition: "Share of swaps by status (SUCCESS, FAILED, REFUNDED, PROCESSING, PENDING_DEPOSIT, INCOMPLETE_DEPOSIT)"
    calc_ref: "pipeline/connectors/intents_explorer.py → pipeline/normalize/intents.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: partial
    limitations: ["Requires Intents JWT; 1 req/5s rate limit"]
    depends_on: []

  - id: intents.chain_distribution.daily
    name: Intents Chain Distribution — Daily
    kind: derived
    unit: USD
    entity: usd
    source:
      name: Internal
      url: "https://github.com/near-value-intelligence"
      endpoint_or_table: "pipeline/normalize/intents.py"
    definition: "Volume USD by origin_chain->dest_chain per day"
    calc_ref: "pipeline/normalize/intents.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: partial
    limitations: ["Derived; requires Intents JWT; unknown chains mapped to 'unknown'"]
    depends_on: ["intents.volume_usd.daily"]

  - id: intents.token_distribution.daily
    name: Intents Token Distribution — Daily
    kind: derived
    unit: USD
    entity: usd
    source:
      name: Internal
      url: "https://github.com/near-value-intelligence"
      endpoint_or_table: "pipeline/normalize/intents.py"
    definition: "Volume USD by origin_symbol->dest_symbol per day"
    calc_ref: "pipeline/normalize/intents.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: partial
    limitations: ["Derived; requires Intents JWT; unknown tokens mapped to 'unknown'"]
    depends_on: ["intents.volume_usd.daily"]

  - id: intents.concentration.daily
    name: Intents Concentration (Top-10 Share) — Daily
    kind: derived
    unit: ratio
    entity: ratio
    source:
      name: Internal
      url: "https://github.com/near-value-intelligence"
      endpoint_or_table: "pipeline/normalize/intents.py"
    definition: "Share of daily volume USD from top 10 sender addresses"
    calc_ref: "pipeline/normalize/intents.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: partial
    limitations: ["Derived; requires Intents JWT; addresses ≠ humans; confidential flows excluded"]
    depends_on: ["intents.volume_usd.daily"]

  - id: nearblocks.revenue_near.daily
    name: NEAR Revenue Wallet Inflows (NEAR) — Daily
    kind: measured
    unit: NEAR
    entity: near
    source:
      name: NearBlocks API
      url: "https://api.nearblocks.io"
      endpoint_or_table: "v1/account/{wallet}/txns"
    definition: "Daily NEAR transfers into the three revenue wallets from intents.near, excluding inter-wallet transfers"
    calc_ref: "pipeline/connectors/nearblocks.py → pipeline/normalize/nearblocks.py"
    granularity: day
    coverage: {since: "2026-07", until: "2026-11"}
    freshness: {max_lag_days: 1}
    completeness: partial
    limitations: ["NearBlocks free tier rate limit; only captures transfers from intents.near; inter-wallet transfers excluded"]
    depends_on: []

  - id: nearblocks.buyback_outflows.daily
    name: Buyback Wallet Outflows (NEAR) — Daily
    kind: measured
    unit: NEAR
    entity: near
    source:
      name: NearBlocks API
      url: "https://api.nearblocks.io"
      endpoint_or_table: "v1/account/buybacks.multisignature.near/txns"
    definition: "Daily NEAR outflows from buybacks.multisignature.near parsed from FUNCTION_CALL add_request actions"
    calc_ref: "pipeline/connectors/nearblocks.py → pipeline/normalize/nearblocks.py"
    granularity: day
    coverage: {since: "2026-07", until: "2026-11"}
    freshness: {max_lag_days: 1}
    completeness: partial
    limitations: ["NearBlocks free tier rate limit; only captures transfers via multisig add_request; older history may be incomplete"]
    depends_on: []

  - id: nearblocks.wnear_transfers.daily
    name: wNEAR Transfers from 1csfundsadmin (wNEAR) — Daily
    kind: measured
    unit: wNEAR
    entity: near
    source:
      name: NearBlocks API
      url: "https://api.nearblocks.io"
      endpoint_or_table: "v1/account/1csfundsadmin.sputnik-dao.near/txns"
    definition: "Daily wNEAR mt_transfer actions from 1csfundsadmin.sputnik-dao.near"
    calc_ref: "pipeline/connectors/nearblocks.py → pipeline/normalize/nearblocks.py"
    granularity: day
    coverage: {since: "2026-09", until: "2026-11"}
    freshness: {max_lag_days: 1}
    completeness: partial
    limitations: ["NearBlocks free tier rate limit; only wNEAR mt_transfer from 1csfundsadmin"]
    depends_on: []

  - id: nearblocks.net_revenue_near.daily
    name: Net NEAR Revenue (NEAR) — Daily
    kind: derived
    unit: NEAR
    entity: near
    source:
      name: Internal
      url: "https://github.com/near-value-intelligence"
      endpoint_or_table: "pipeline/normalize/nearblocks.py"
    definition: "NEAR revenue inflows minus buyback wallet outflows per day"
    calc_ref: "pipeline/normalize/nearblocks.py"
    granularity: day
    coverage: {}
    freshness: {}
    completeness: partial
    limitations: ["Derived; assumes buyback outflows are the only outflows from revenue wallets"]
    depends_on: ["nearblocks.revenue_near.daily", "nearblocks.buyback_outflows.daily"]

  - id: defillama.chain_tvl_near.daily
    name: NEAR Chain TVL (DefiLlama) — Daily
    kind: measured
    unit: USD
    entity: usd
    source:
      name: DefiLlama
      url: "https://api.llama.fi/v2/historicalChainTvl/NEAR"
      endpoint_or_table: "historicalChainTvl/NEAR"
    definition: "Total Value Locked across all NEAR protocols as reported by DefiLlama"
    calc_ref: "pipeline/connectors/defillama_chain.py → pipeline/normalize/defillama_chain.py"
    granularity: day
    coverage: {since: "2021-12", until: "2026-11"}
    freshness: {max_lag_days: 1}
    completeness: complete
    limitations: ["DefiLlama methodology may differ from onchain measurements"]
    depends_on: []

  - id: pikespeak.hot_wallets_total_balance.daily
    name: Top 100 Hot Wallets Total Balance (NEAR) — Daily
    kind: measured
    unit: NEAR
    entity: near
    source:
      name: Pikespeak
      url: "https://api.pikespeak.ai"
      endpoint_or_table: "hot-wallets/near"
    definition: "Sum of NEAR balances across top 100 wallets by total USD value"
    calc_ref: "pipeline/connectors/pikespeak.py → pipeline/normalize/pikespeak.py"
    granularity: day
    coverage: {since: "2026-11", until: "2026-11"}
    freshness: {max_lag_days: 1}
    completeness: partial
    limitations: ["Snapshot only — no historical backfill available", "Top 100 by USD value, not by NEAR balance"]
    depends_on: []

  - id: pikespeak.hot_wallets_count.daily
    name: Hot Wallets Count — Daily
    kind: measured
    unit: count
    entity: count
    source:
      name: Pikespeak
      url: "https://api.pikespeak.ai"
      endpoint_or_table: "hot-wallets/near"
    definition: "Number of wallets in top 100 hot wallets list"
    calc_ref: "pipeline/connectors/pikespeak.py → pipeline/normalize/pikespeak.py"
    granularity: day
    coverage: {since: "2026-11", until: "2026-11"}
    freshness: {max_lag_days: 1}
    completeness: partial
    limitations: ["Snapshot only — no historical backfill available"]
    depends_on: []
